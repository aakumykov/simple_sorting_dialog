plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.github.aakumykov.simple_sorting_dialog'
    compileSdk 36

    defaultConfig {
        applicationId "com.github.aakumykov.simple_sorting_dialog"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        viewBinding true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            kotlinOptions {
                freeCompilerArgs = ["-Xdebug"]
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'

    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation project(':simple_sorting_dialog')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

//    implementation "com.github.permissions-dispatcher:ktx:1.1.4"

//    implementation 'com.github.aakumykov:java-faker:525aaf096b'

    implementation 'androidx.fragment:fragment-ktx:1.8.9'
//    implementation "androidx.activity:activity-ktx:1.8.2"

    implementation "androidx.preference:preference-ktx:1.2.1"
}